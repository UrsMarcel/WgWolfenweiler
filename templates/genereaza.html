<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rechnung erstellen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0F111A; color: #F3F4F6; font-family: sans-serif;}
    </style>
</head>
<body class="p-10 flex justify-center items-center min-h-screen">

    <div class="bg-[#1A1D27] p-8 rounded-xl border border-gray-800 shadow-xl w-full max-w-md">
        <h2 class="text-2xl font-bold text-white mb-6">Neue Rechnung</h2>
        
        <form action="/genereaza" method="POST" class="space-y-4">
            <div>
                <label class="block text-gray-400 text-sm mb-1">Kunde (Client)</label>
                <input type="text" name="client" required class="w-full bg-[#0F111A] border border-gray-700 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-1">Betrag (Suma EUR)</label>
                <input type="number" step="0.01" name="suma" required class="w-full bg-[#0F111A] border border-gray-700 rounded p-2 text-white">
            </div>
            <div>
                <label class="block text-gray-400 text-sm mb-1">Status</label>
                <select name="status" class="w-full bg-[#0F111A] border border-gray-700 rounded p-2 text-white">
                    <option value="vandut">Bezahlt (Plătit)</option>
                    <option value="neplatit">Offen (Neplătit)</option>
                </select>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded mt-4 transition">Rechnung speichern</button>
            <a href="/index" class="block text-center text-gray-400 hover:text-white mt-4 text-sm">Zurück zum Dashboard</a>
        </form>
    </div>

</body>
</html>
